[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.13.0"
edition = "2024"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Disabled: this lint rewrites an explicit ramp into `f32::midpoint(a, b)`,
# which reads as a physical relation that keeps rising past its plateau and
# is then silently truncated by a clamp (#49). Readable equations win over
# the shorter call.
manual_midpoint = { level = "allow", priority = 1 }

# Aggressive release profile for the sim, issue #41.
# The hot path is CPU-bound, deterministic, and benchmarked in a loop; we
# accept the compile cost (~30 s -> ~2 min) to gain on runtime.
[profile.release]
lto = "fat"
codegen-units = 1
debug = false

# The tests run the sim: at opt-level 0 the suite is ~10x slower
# (test cleanup effort 2026-07-10: `dynamics::anomaly_mode_…` 1151 s in
# debug vs ~2 min optimized). opt-level 3 without LTO keeps incremental
# compile fast, and keeps debug-assertions + overflow-checks (which the
# fat-LTO release profile doesn't have); this is the dev-loop profile.
# `[profile.test]` inherits from dev; so do the test binaries' deps.
[profile.dev]
opt-level = 3
