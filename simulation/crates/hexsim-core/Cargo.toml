[package]
name = "hexsim-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
noise = "0.9"
rmp-serde = "1.3"
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.10"

[features]
default = ["parallel"]
# Per-cell loops run on rayon's global thread pool instead of serially.
# Off by default only for `hexsim-proto` (the WASM embed), which depends
# on `hexsim-core` with `default-features = false`: rayon needs real OS
# threads, unavailable on `wasm32-unknown-unknown`.
parallel = ["dep:rayon"]

[lints]
workspace = true
